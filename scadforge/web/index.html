<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scadforge</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font:14px -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  header h1 span { color:var(--accent); }
  header .sub { color:var(--dim); font-size:12px; }
  header button { margin-left:auto; background:#238636; color:#fff; border:0; border-radius:6px;
                  padding:6px 16px; font-size:13px; font-weight:600; cursor:pointer; }
  header button:hover { background:#2ea043; }
  main { flex:1; display:flex; min-height:0; }
  #left { width:44%; display:flex; flex-direction:column; border-right:1px solid var(--line); min-width:280px; }
  #editor { flex:1; background:var(--bg); color:var(--text); border:0; outline:none; resize:none;
            padding:14px 16px; font:13px/1.5 "DejaVu Sans Mono", Menlo, monospace; }
  #messages { max-height:30%; overflow:auto; border-top:1px solid var(--line); padding:8px 14px;
              font:12px/1.6 "DejaVu Sans Mono", monospace; }
  #messages .err { color:#f85149; }
  #messages .warn { color:#d29922; }
  #messages .ok { color:#3fb950; }
  #right { flex:1; position:relative; }
  #view { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:12px;
         background:rgba(13,17,23,.7); padding:4px 10px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>scad<span>forge</span></h1>
  <div class="sub">from-scratch OpenSCAD-compatible modeler &middot; localhost &middot; zero dependencies</div>
  <button id="renderBtn">Render&nbsp;(Ctrl+Enter)</button>
</header>
<main>
  <div id="left">
    <textarea id="editor" spellcheck="false">// scadforge demo — offset() and projection(), the last two phase-4 ops.
// offset grows/shrinks 2D outlines; projection drops 3D solids to 2D.
$fn = 48;

// base plate
color("#39404f") translate([0, 0, -1.5]) cube([90, 90, 3], center = true);

// OFFSET (round): grow a rectangle outward with rounded corners → a pebble
color("goldenrod")
translate([-30, 0, 0])
linear_extrude(height = 5)
offset(r = 4) square([12, 7], center = true);

// OFFSET as a frame: (outline grown) minus (outline) → a rounded picture frame
color("tomato")
translate([0, 0, 0])
linear_extrude(height = 6)
difference() {
  offset(r = 3) square([16, 10], center = true);
  square([16, 10], center = true);
}

// OFFSET (chamfer): delta with flat-cut corners → a chamfered square
color("steelblue")
translate([28, 0, 0])
linear_extrude(height = 6)
offset(delta = 3, chamfer = true) square([10, 10], center = true);

// PROJECTION (cut): slice a sphere at its equator → a disc, re-extruded
color([0.4, 0.7, 0.5])
translate([-26, 32, 0])
linear_extrude(height = 4)
projection(cut = true) sphere(9);

// PROJECTION (silhouette): the shadow of a cube drilled by a hex bar →
// a square with a hexagonal hole, re-extruded into a plate
color("orange")
translate([24, 32, 0])
linear_extrude(height = 4)
projection()
difference() {
  cube(15, center = true);
  cylinder(h = 30, r = 5, center = true, $fn = 6);
}
</textarea>
    <div id="messages"><span class="ok">ready.</span></div>
  </div>
  <div id="right">
    <canvas id="view"></canvas>
    <div id="hud">drag to orbit &middot; wheel to zoom</div>
  </div>
</main>
<script>
'use strict';
let canvas = document.getElementById('view');
const viewport = document.getElementById('right');
const messages = document.getElementById('messages');
const editor = document.getElementById('editor');

// A canvas that has ever returned a 'webgl' context can never hand out a
// '2d' one. If GL init gets a context but then fails (shader compile,
// link), swap in a fresh node so the software path still works.
// Interaction listeners live on the container, so they survive the swap.
function replaceCanvas() {
  const fresh = canvas.cloneNode(false);
  canvas.replaceWith(fresh);
  canvas = fresh;
}

// ---- scene state ----------------------------------------------------------
let soup = [];        // per-mesh: {verts: Float32Array (x,y,z,nx,ny,nz)*, color:[r,g,b,a]}
let center = [0,0,0], radius = 10;
let yaw = -0.7, pitch = 0.42, dist = 3.2;   // dist is a multiple of radius

function setMessages(items) {
  messages.innerHTML = items.map(m =>
    `<div class="${m.cls}">${m.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('') ||
    '<span class="ok">ok.</span>';
}

async function render() {
  let data;
  try {
    const res = await fetch('/render', { method: 'POST', body: editor.value });
    data = await res.json();
  } catch (e) {
    setMessages([{cls:'err', text: 'render request failed: ' + e}]);
    uploadAndDraw(); // still size and clear the canvas
    return;
  }
  const msgs = [];
  if (data.error) msgs.push({cls:'err', text: data.error.startsWith('ERROR') ? data.error : 'error: ' + data.error});
  for (const e of data.echoes || []) msgs.push({cls:'ok', text: e});
  for (const w of data.warnings || []) msgs.push({cls:'warn', text: 'warning: ' + w});
  soup = [];
  let tris = 0;
  const lo = [Infinity,Infinity,Infinity], hi = [-Infinity,-Infinity,-Infinity];
  for (const mesh of data.meshes || []) {
    const p = mesh.positions, idx = mesh.indices;
    const verts = new Float32Array(idx.length * 6);
    for (let t = 0; t < idx.length; t += 3) {
      const a = idx[t]*3, b = idx[t+1]*3, c = idx[t+2]*3;
      const ax=p[a],ay=p[a+1],az=p[a+2], bx=p[b],by=p[b+1],bz=p[b+2], cx=p[c],cy=p[c+1],cz=p[c+2];
      let nx=(by-ay)*(cz-az)-(bz-az)*(cy-ay),
          ny=(bz-az)*(cx-ax)-(bx-ax)*(cz-az),
          nz=(bx-ax)*(cy-ay)-(by-ay)*(cx-ax);
      const nl = Math.hypot(nx,ny,nz) || 1; nx/=nl; ny/=nl; nz/=nl;
      const vs = [[ax,ay,az],[bx,by,bz],[cx,cy,cz]];
      for (let k = 0; k < 3; k++) {
        const o = (t + k) * 6, v = vs[k];
        verts[o]=v[0]; verts[o+1]=v[1]; verts[o+2]=v[2];
        verts[o+3]=nx; verts[o+4]=ny; verts[o+5]=nz;
        for (let d = 0; d < 3; d++) { lo[d]=Math.min(lo[d],v[d]); hi[d]=Math.max(hi[d],v[d]); }
      }
      tris++;
    }
    soup.push({ verts, color: mesh.color });
  }
  // Opaque meshes first so both render paths can draw transparency in a
  // second pass (depth-tested, no depth write). Stable sort keeps source
  // order within each group.
  soup.sort((a, b) => (b.color[3] >= 1) - (a.color[3] >= 1));
  if (tris > 0) {
    center = [(lo[0]+hi[0])/2, (lo[1]+hi[1])/2, (lo[2]+hi[2])/2];
    radius = Math.max(1e-6, Math.hypot(hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]) / 2);
    msgs.push({cls:'ok', text: `rendered ${(data.meshes||[]).length} shape(s), ${tris} triangles`});
  } else if (!data.error) {
    msgs.push({cls:'warn', text: 'no geometry produced'});
  }
  setMessages(msgs);
  uploadAndDraw();
}

// ---- camera math ----------------------------------------------------------
function viewProj(w, h) {
  const eyeDist = dist * radius;
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const eye = [center[0] + eyeDist*cp*cy, center[1] + eyeDist*cp*sy, center[2] + eyeDist*sp];
  // Look-at with +Z up.
  let f = [center[0]-eye[0], center[1]-eye[1], center[2]-eye[2]];
  const fl = Math.hypot(...f); f = f.map(v => v/fl);
  let s = [f[1]*0 - f[2]*0 + f[1]*1 - f[1]*0, 0, 0]; // placeholder, computed below
  // side = f x up ; up = (0,0,1)
  s = [f[1]*1 - f[2]*0, f[2]*0 - f[0]*1, f[0]*0 - f[1]*0];
  const slen = Math.hypot(...s) || 1; s[0]/=slen; s[1]/=slen; s[2]/=slen;
  const u = [s[1]*f[2]-s[2]*f[1], s[2]*f[0]-s[0]*f[2], s[0]*f[1]-s[1]*f[0]];
  const near = eyeDist/100, far = eyeDist*10, fov = Math.PI/5, aspect = w/h;
  const t = 1/Math.tan(fov/2);
  return { eye,
    tx: p => {   // world → clip; returns [x,y,z,w]
      const x = p[0]-eye[0], y = p[1]-eye[1], z = p[2]-eye[2];
      const vx = s[0]*x + s[1]*y + s[2]*z;
      const vy = u[0]*x + u[1]*y + u[2]*z;
      const vz = -(f[0]*x + f[1]*y + f[2]*z);
      return [ (t/aspect)*vx, t*vy,
               (far+near)/(near-far)*vz + (2*far*near)/(near-far), -vz ];
    } };
}

// ---- WebGL renderer with 2D-canvas software fallback ----------------------
let gl = null, prog = null, tried = false, loc = null;
function initGL() {
  if (tried) return gl; tried = true;
  gl = canvas.getContext('webgl', { antialias: true, alpha: false });
  if (!gl) { gl = null; return null; }
  const vs = `attribute vec3 aPos; attribute vec3 aNorm; uniform mat4 uMVP;
    varying vec3 vNorm; void main(){ vNorm=aNorm; gl_Position=uMVP*vec4(aPos,1.0); }`;
  const fs = `precision mediump float; uniform vec4 uColor; varying vec3 vNorm;
    void main(){ vec3 L=normalize(vec3(0.5,0.35,0.85));
      float d=max(dot(normalize(vNorm),L),0.0)*0.75+0.25;
      gl_FragColor=vec4(uColor.rgb*d, uColor.a); }`;
  const mk = (type, src) => { const sh = gl.createShader(type); gl.shaderSource(sh, src);
    gl.compileShader(sh); return gl.getShaderParameter(sh, gl.COMPILE_STATUS) ? sh : null; };
  const v = mk(gl.VERTEX_SHADER, vs), f = mk(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) { gl = null; replaceCanvas(); return null; }
  prog = gl.createProgram(); gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { gl = null; replaceCanvas(); return null; }
  gl.enable(gl.DEPTH_TEST);
  loc = {
    aPos: gl.getAttribLocation(prog, 'aPos'),
    aNorm: gl.getAttribLocation(prog, 'aNorm'),
    uMVP: gl.getUniformLocation(prog, 'uMVP'),
    uColor: gl.getUniformLocation(prog, 'uColor'),
  };
  return gl;
}

function mvpMatrix(w, h) {
  // Column-major MVP equivalent to viewProj's tx(), for the GL path.
  const eyeDist = dist * radius;
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw);
  const eye = [center[0]+eyeDist*cp*cy, center[1]+eyeDist*cp*sy, center[2]+eyeDist*sp];
  let f = [center[0]-eye[0], center[1]-eye[1], center[2]-eye[2]];
  const fl = Math.hypot(...f); f = f.map(v=>v/fl);
  let s = [f[1], -f[0], 0];
  const sl = Math.hypot(...s) || 1; s = s.map(v=>v/sl);
  const u = [s[1]*f[2]-s[2]*f[1], s[2]*f[0]-s[0]*f[2], s[0]*f[1]-s[1]*f[0]];
  const near = eyeDist/100, far = eyeDist*10, t = 1/Math.tan(Math.PI/10), aspect = w/h;
  const a = t/aspect, b = t, c = (far+near)/(near-far), d = (2*far*near)/(near-far);
  const ex = -(s[0]*eye[0]+s[1]*eye[1]+s[2]*eye[2]);
  const ey = -(u[0]*eye[0]+u[1]*eye[1]+u[2]*eye[2]);
  const ez =  (f[0]*eye[0]+f[1]*eye[1]+f[2]*eye[2]);
  return new Float32Array([
    a*s[0], b*u[0], c*-f[0], f[0],
    a*s[1], b*u[1], c*-f[1], f[1],
    a*s[2], b*u[2], c*-f[2], f[2],
    a*ex,   b*ey,   c*ez+d,  -ez,
  ]);
}

let glBuffers = [];
function uploadAndDraw() {
  if (initGL()) {
    for (const b of glBuffers) gl.deleteBuffer(b.buf);
    glBuffers = soup.map(m => {
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, m.verts, gl.STATIC_DRAW);
      return { buf, count: m.verts.length / 6, color: m.color };
    });
  }
  draw();
}

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w < 1 || h < 1) return;
  // Resizing the backing store clears it, so only touch it on change.
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  if (gl) {
    gl.viewport(0, 0, w, h);
    gl.clearColor(0.05, 0.07, 0.09, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(prog);
    gl.uniformMatrix4fv(loc.uMVP, false, mvpMatrix(w, h));
    const drawMesh = m => {
      gl.bindBuffer(gl.ARRAY_BUFFER, m.buf);
      gl.enableVertexAttribArray(loc.aPos);
      gl.enableVertexAttribArray(loc.aNorm);
      gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(loc.aNorm, 3, gl.FLOAT, false, 24, 12);
      gl.uniform4fv(loc.uColor, m.color);
      gl.drawArrays(gl.TRIANGLES, 0, m.count);
    };
    // glBuffers mirrors soup's opaque-first order: draw opaque with the
    // depth buffer, then transparency blended without depth writes.
    let blending = false;
    for (const m of glBuffers) {
      if (!blending && m.color[3] < 1) {
        blending = true;
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
      }
      drawMesh(m);
    }
    if (blending) { gl.depthMask(true); gl.disable(gl.BLEND); }
    return;
  }
  softwareDraw(w, h);
}

// Software z-buffer fallback: same scene, no GPU required. Per-pixel
// depth testing — painter's-algorithm sorting fails when large faces
// (the base plate) overlap small nearby ones. Frame buffers are reused
// across frames; soup is opaque-first so transparency runs as a second
// pass with depth test but no depth write, mirroring the GL path.
let swCache = null;
function softwareDraw(w, h) {
  const ctx = canvas.getContext('2d');
  if (!ctx) {
    setMessages([{cls:'err', text: 'no renderer available (canvas context unavailable)'}]);
    return;
  }
  if (!swCache || swCache.w !== w || swCache.h !== h) {
    const img = ctx.createImageData(w, h);
    const bg = new Uint8ClampedArray(w * h * 4);
    for (let i = 0; i < bg.length; i += 4) {
      bg[i] = 13; bg[i+1] = 18; bg[i+2] = 23; bg[i+3] = 255; // #0d1217
    }
    swCache = { w, h, img, bg, zbuf: new Float32Array(w * h) };
  }
  const { img, bg, zbuf } = swCache;
  const px = img.data;
  px.set(bg);
  zbuf.fill(Infinity);
  const cam = viewProj(w, h);
  const eye = cam.eye;
  // Same light as the GL shader, normalized to match its shading exactly.
  const Ll = Math.hypot(0.5, 0.35, 0.85);
  const L0 = 0.5/Ll, L1 = 0.35/Ll, L2 = 0.85/Ll;
  for (const m of soup) {
    const v = m.verts;
    const [cr, cg, cb, ca] = m.color;
    const opaque = ca >= 1;
    for (let i = 0; i < v.length; i += 18) {
      // Backface cull opaque meshes (winding-convention-free: the face
      // normal comes from the vertex data, so test it against the eye
      // ray). Transparent meshes keep interior faces, like the GL path.
      if (opaque) {
        const facing = v[i+3]*(eye[0]-v[i]) + v[i+4]*(eye[1]-v[i+1]) + v[i+5]*(eye[2]-v[i+2]);
        if (facing <= 0) continue;
      }
      const sx = [], sy = [], sz = [];
      let behind = false;
      for (let k = 0; k < 3; k++) {
        const o = i + k*6;
        const clip = cam.tx([v[o], v[o+1], v[o+2]]);
        if (clip[3] <= 0) { behind = true; break; }
        sx.push((clip[0]/clip[3]*0.5+0.5)*w);
        sy.push((0.5-clip[1]/clip[3]*0.5)*h);
        // NDC z is affine in screen space, so barycentric interpolation
        // of it gives a correct per-pixel depth test.
        sz.push(clip[2]/clip[3]);
      }
      if (behind) continue;
      const area = (sx[1]-sx[0])*(sy[2]-sy[0]) - (sx[2]-sx[0])*(sy[1]-sy[0]);
      if (Math.abs(area) < 1e-9) continue;
      const shade = Math.max(v[i+3]*L0+v[i+4]*L1+v[i+5]*L2, 0)*0.75+0.25;
      const r = Math.min(255, (cr*shade*255)|0);
      const g = Math.min(255, (cg*shade*255)|0);
      const b = Math.min(255, (cb*shade*255)|0);
      const x0 = Math.max(0, Math.floor(Math.min(sx[0], sx[1], sx[2])));
      const x1 = Math.min(w - 1, Math.ceil(Math.max(sx[0], sx[1], sx[2])));
      const y0 = Math.max(0, Math.floor(Math.min(sy[0], sy[1], sy[2])));
      const y1 = Math.min(h - 1, Math.ceil(Math.max(sy[0], sy[1], sy[2])));
      // Barycentric weights are affine in screen space; step them
      // incrementally instead of re-deriving edge functions per pixel.
      // Normalizing by the signed area makes either winding rasterize.
      const inv = 1 / area;
      const dw0x = (sy[1]-sy[2]) * inv, dw0y = (sx[2]-sx[1]) * inv;
      const dw1x = (sy[2]-sy[0]) * inv, dw1y = (sx[0]-sx[2]) * inv;
      const k0 = (sx[1]*sy[2] - sx[2]*sy[1]) * inv;
      const k1 = (sx[2]*sy[0] - sx[0]*sy[2]) * inv;
      const dz0 = sz[0]-sz[2], dz1 = sz[1]-sz[2];
      const dzx = dw0x*dz0 + dw1x*dz1;
      for (let y = y0; y <= y1; y++) {
        const cy = y + 0.5, cx = x0 + 0.5;
        let w0 = k0 + dw0x*cx + dw0y*cy;
        let w1 = k1 + dw1x*cx + dw1y*cy;
        let z = sz[2] + w0*dz0 + w1*dz1;
        let at = y * w + x0;
        for (let x = x0; x <= x1; x++, at++, w0 += dw0x, w1 += dw1x, z += dzx) {
          if (w0 < 0 || w1 < 0 || w0 + w1 > 1) continue;
          if (z >= zbuf[at]) continue;
          const o = at * 4;
          if (opaque) {
            zbuf[at] = z;
            px[o] = r; px[o+1] = g; px[o+2] = b;
          } else {
            // Transparent pass: blend, leave the depth buffer alone.
            px[o]   = (r*ca + px[o]  *(1-ca))|0;
            px[o+1] = (g*ca + px[o+1]*(1-ca))|0;
            px[o+2] = (b*ca + px[o+2]*(1-ca))|0;
          }
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---- interaction ----------------------------------------------------------
// Coalesce redraw requests to one per animation frame — mousemove and
// wheel can fire far faster than the software path can paint.
let drawQueued = false;
function scheduleDraw() {
  if (drawQueued) return;
  drawQueued = true;
  requestAnimationFrame(() => { drawQueued = false; draw(); });
}

let dragging = false, lastX = 0, lastY = 0;
viewport.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  yaw   -= (e.clientX - lastX) * 0.008;
  pitch = Math.min(1.5, Math.max(-1.5, pitch + (e.clientY - lastY) * 0.008));
  lastX = e.clientX; lastY = e.clientY;
  scheduleDraw();
});
viewport.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.min(12, Math.max(1.2, dist * (e.deltaY > 0 ? 1.1 : 0.9)));
  scheduleDraw();
}, { passive: false });
window.addEventListener('resize', scheduleDraw);
document.getElementById('renderBtn').addEventListener('click', render);
editor.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); render(); }
});

// Shareable links: #src=<url-encoded source> pre-loads the editor.
if (location.hash.startsWith('#src=')) {
  try { editor.value = decodeURIComponent(location.hash.slice(5)); } catch (e) {}
}
render();
</script>
</body>
</html>
